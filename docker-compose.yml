services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-inventory_pcbexpressjogja}
      MARIADB_USER: ${MARIADB_USER:-inventory}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-inventory_secret}
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Real data dump is gitignored; if you have it locally, import manually: docker exec -i db mariadb -u root -proot inventory_pcbexpressjogja < database/inventory_pcbexpressjogja.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./database/real_indexes.sql:/docker-entrypoint-initdb.d/002_real_indexes.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: php:8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/apache.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MARIADB_DATABASE:-inventory_pcbexpressjogja}
      DB_USERNAME: ${MARIADB_USER:-inventory}
      DB_PASSWORD: ${MARIADB_PASSWORD:-inventory_secret}
      APP_DEBUG: ${APP_DEBUG:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      API_TOKEN: ${API_TOKEN:-}
      API_PROTECT_ALL: ${API_PROTECT_ALL:-false}
    command: >
      bash -c "
      a2enmod rewrite headers &&
      docker-php-ext-install pdo pdo_mysql &&
      echo 'ServerName localhost' >> /etc/apache2/apache2.conf &&
      if ! command -v composer >/dev/null 2>&1; then
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer;
      fi &&
      cd /var/www/html && composer install --no-interaction --no-progress || true &&
      mkdir -p /var/www/html/public/uploads && chown -R www-data:www-data /var/www/html/public/uploads && chmod -R 775 /var/www/html/public/uploads &&
      apache2-foreground
      "

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  mariadb_data:
